<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POP</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <canvas id="c"></canvas>

  <div class="hud">
    <div class="row">Score</div>
    <div class="val" id="score">0</div>
    <div class="row">Best</div>
    <div class="val" id="high" style="font-size:18px;opacity:0.7">0</div>
    <div class="lives" id="lives">♥ ♥ ♥</div>
  </div>

  <div class="wave-badge" id="wave">Wave 1</div>
  <div class="xp-wrap" id="xp-wrap">
    <div class="xp-row"><span id="xp-level">Lv 1</span><span id="xp-text">0 / 100</span></div>
    <div class="xp-bar-bg"><div class="xp-bar-fill" id="xp-bar-fill"></div></div>
  </div>
  <div class="upgrade-list" id="upgrade-list"></div>

  <div class="title">
    <h1>POP</h1>
    <p>orbs · spikes · hearts</p>
  </div>

  <div class="start-hint" id="hint">
    move with <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>
    or <span class="key">↑</span><span class="key">←</span><span class="key">↓</span><span class="key">→</span>
    · <span class="key">Space</span> to shoot
    · press any key to start
  </div>

  <div id="control-toggle" class="control-toggle">Control: KEYBOARD</div>

  <div class="stat-hud" id="stat-hud">
    <div class="stat-hud-header">
      <span class="stat-hud-title">STATS</span>
      <span class="stat-hud-points" id="stat-points">0 pts</span>
    </div>
    <div class="stat-rows" id="stat-rows"></div>
    <div class="stat-hud-hint">Press 1–8 to invest</div>
  </div>

  <div class="overlay" id="overlay">
    <h2 id="endTitle">Game Over</h2>
    <div class="final" id="finalScore">Score: 0</div>
    <div class="high-label" id="bestScore">Best: 0</div>
    <button id="restartBtn">Play Again</button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
